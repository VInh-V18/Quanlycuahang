name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (unit + Testcontainers IT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      # `mvn verify` (khong phai `test`) de chay ca surefire (*Test.java, unit) LAN failsafe
      # (*IT.java, Testcontainers) — 2 plugin rieng bam vao 2 phase khac nhau (xem pom.xml). Runner
      # Ubuntu co san Docker daemon dang chay -> Testcontainers (DebtRepositoryIT,
      # OrderRepositoryRevenueIT, ProductRepositoryIT — Phase 3/11) chay that, khac voi sandbox
      # phat trien (khong co Docker daemon, xem docs/PROJECT_STATE.md). `verify` cung kich hoat
      # spotless:check (format code) da cau hinh san trong pom.xml.
      - name: mvn verify
        working-directory: server
        run: mvn -B verify

      - name: Upload surefire/failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            server/target/surefire-reports
            server/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend (lint + typecheck + unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: npm ci
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Typecheck
        working-directory: client
        run: npx tsc --noEmit

      - name: Unit test (Vitest)
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quanlycuahang
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d quanlycuahang"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build backend jar (skip tests — đã chạy ở job backend)
        working-directory: server
        run: mvn -B -q package -DskipTests

      - name: Start backend
        working-directory: server
        env:
          # Profile "local" da mac dinh DB/Redis host=localhost, port chuan, CORS cho
          # http://localhost:5173 va refresh-cookie-secure=false — dung dung voi services
          # postgres/redis o tren va Vite dev server, khong can override gi khac ngoai secret.
          SPRING_PROFILES_ACTIVE: local
          JWT_SECRET: ci-e2e-secret-not-for-production-use-only
        run: |
          nohup java -jar target/server-*.jar > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$code" = "200" ]; then echo "Backend up after $i tries"; exit 0; fi
            sleep 2
          done
          echo "Backend failed to start"; cat /tmp/server.log; exit 1

      - name: npm ci
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: client
        run: |
          nohup npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ || true)
            if [ "$code" = "200" ]; then echo "Frontend up after $i tries"; exit 0; fi
            sleep 2
          done
          echo "Frontend failed to start"; cat /tmp/vite.log; exit 1

      - name: Run Playwright tests
        working-directory: client
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
