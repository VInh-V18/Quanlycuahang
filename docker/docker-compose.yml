# Phase 12 — 1 bo compose dung chung ca 2 kich ban trien khai (VPS internet-facing hoac LAN noi
# bo, xem docs/phase1/component-deployment-diagram.md), khac nhau o .env (CORS_ALLOWED_ORIGINS,
# AUTH_REFRESH_COOKIE_SECURE) va co dat TLS/reverse-proxy rieng phia truoc container "web" hay
# khong. Chay tu thu muc goc repo: `docker compose -f docker/docker-compose.yml up -d`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    # Bo comment dong duoi de goi truc tiep API tu may host luc debug — binh thuong client goi
    # qua nginx proxy /api nen khong can mo cong nay ra Internet.
    # ports:
    #   - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server-uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ../client
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  server-uploads:
