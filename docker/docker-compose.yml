# Phase 12 — 1 bo compose dung chung ca 2 kich ban trien khai (VPS internet-facing hoac LAN noi
# bo, xem docs/phase1/component-deployment-diagram.md), khac nhau o .env (CORS_ALLOWED_ORIGINS,
# AUTH_REFRESH_COOKIE_SECURE) va co dat TLS/reverse-proxy rieng phia truoc container "web" hay
# khong. Chay tu thu muc goc repo: `docker compose --env-file .env -f docker/docker-compose.yml up
# -d --build`. BAT BUOC co --env-file .env: Compose mac dinh tim .env o thu muc CHUA file compose
# nay (docker/), khong phai o goc repo noi .env that su nam - thieu co nay se lam DB_PASSWORD/cac
# bien khac rong, Postgres tu choi khoi dong (phat hien khi rieng soat).

# Log rotation dung chung moi container (Prompt #9, P2 CI/CD) - khong gioi han, log JSON cua
# Docker se tich luy vo han tren dia may chu qua nhieu thang/nam chay lien tuc, co the lam day dia
# va sap ca he thong (khong lien quan gi den ung dung nhung van la 1 su co that). 10m x 5 file =
# toi da 50MB/container, du de xem lai vai ngay gan nhat ma khong lo day dia.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # log_min_duration_statement=500 - ghi log MOI cau lenh SQL cham hon 500ms (Prompt #7, P2 hieu
    # nang: "them log truy van cham") - khong bat log_statement=all (se ghi MOI cau, qua nhieu o SaaS
    # nhieu tenant), chi ghi cau THAT SU cham de con dieu tra khi nghi ngo thieu index/N+1 con sot.
    command: ["postgres", "-c", "log_min_duration_statement=500"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    # Bo comment dong duoi de goi truc tiep API tu may host luc debug — binh thuong client goi
    # qua nginx proxy /api nen khong can mo cong nay ra Internet.
    # ports:
    #   - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server-uploads:/app/uploads
    restart: unless-stopped
    logging: *default-logging

  # Prompt #12 - dich vu du bao nhap hang nang cao (FastAPI + scikit-learn IsolationForest), NOI BO
  # HOAN TOAN (khong publish port ra host, server goi qua ten container trong docker network noi
  # bo cua Compose). KHONG khai bao depends_on tu "server" toi day (va nguoc lai) - day la tinh
  # nang PHU, co the that bai/khoi dong cham ma khong duoc lam cham hay chan server khoi dong; xem
  # AiForecastService tu dong fallback ve cong thuc don gian khi dich vu nay khong tra loi kip.
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  # Prompt #12 (nang cap) - model AI tu host qua Ollama, thay the API dam may Anthropic khi
  # AI_PROVIDER_TYPE=ollama trong .env (xem OllamaAiProvider) - mien phi, khong gui du lieu ra
  # ngoai, nhung can RAM rieng cho model (xem gioi han memory duoi day). KHONG publish port 11434
  # ra host (chi server goi qua ten container trong docker network noi bo), KHONG khai bao
  # depends_on tu "server" (tuong tu ml-service - AI chi dap ung loi nhe nhang neu Ollama chua san
  # sang/chua pull model, khong lam cham hay chan server khoi dong).
  #
  # BAT BUOC lam 1 LAN sau khi container nay chay lan dau (Ollama khong tu dong tai model):
  #   docker exec <ten-container-ollama> ollama pull qwen2.5:3b
  # (doi dung ten model neu doi AI_OLLAMA_MODEL trong .env). Xem README_DEPLOY.md muc AI de biet
  # them chi tiet + huong dan nang cap model neu may chu co nhieu RAM/GPU hon.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    # Gioi han RAM (4GB) - phong ho may chu RAM khiem ton (vd 8GB dung chung Postgres/Redis/
    # server/web/ml-service): neu KHONG gioi han, 1 model qua lon vo tinh duoc pull co the chiem
    # het RAM con lai va lam CAC container KHAC (kho quan trong hon nhieu, vd Postgres) bi
    # out-of-memory. Tang gia tri nay neu chuyen sang model lon hon qwen2.5:3b.
    deploy:
      resources:
        limits:
          memory: 4g
        # Bo comment 3 dong duoi neu may chu co GPU NVIDIA (can cai san nvidia-container-toolkit)
        # de tang toc do dang ke - CHUA kiem chung tren GPU that trong moi truong phat trien nay:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: 1
        #       capabilities: [gpu]

  web:
    build:
      context: ../client
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # server co HEALTHCHECK rieng trong Dockerfile (goi /actuator/health) - cho server THAT SU
      # san sang (Flyway migrate xong, Postgres/Redis da ket noi duoc) roi moi khoi dong web, tranh
      # nginx nhan request nguoi dung ngay luc server con dang migrate/khoi dong (phat hien khi
      # rieng soat: truoc day chi cho "server da start container", khong phai "server da san sang").
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  server-uploads:
  ollama-data:
