# Nginx phuc vu SPA (static build) + proxy /api sang container server (Phase 12).
# Dung chung cho ca 2 kich ban trien khai (VPS HTTPS qua reverse proxy/certbot rieng, hoac LAN
# HTTP truc tiep — xem docs/phase1/component-deployment-diagram.md) vi container nay chi lang
# nghe HTTP :80; TLS (neu can) xu ly o tang truoc (Nginx/Caddy ngoai VPS + Let's Encrypt).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;

    # Header bao mat co ban - khong them Strict-Transport-Security o day: container nay chi lang
    # nghe HTTP thuan (xem comment dau file), TLS neu co xu ly o tang truoc; ep HSTS tai day se lam
    # hong han kich ban trien khai LAN thuan HTTP (trinh duyet nho ep HTTPS cho host nay nhung LAN
    # khong co HTTPS, mat truy cap cho toi khi xoa HSTS cache) - phat hien khi rieng soat bao mat.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # SPA fallback: moi route khong khop file tinh deu tra ve index.html de React Router xu ly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache dai cho asset da hash ten (Vite build) — index.html KHONG duoc cache (luon co ban moi
    # sau deploy).
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ^~ bat buoc uu tien prefix nay hon moi regex location ben duoi (vd anh QR upload dang
    # /api/v1/uploads/xxx.png se bi regex ".png$" o duoi "an" mat, tra thang 404 tu nginx thay vi
    # proxy sang server — day la nguyen nhan anh QR khong hien duoc sau khi upload).
    location ^~ /api/ {
        proxy_pass http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
