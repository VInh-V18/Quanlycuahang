spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Swagger UI/OpenAPI docs permitAll trong SecurityConfig (dung cho dev) — tat han o prod de khong lo
# toan bo API surface (endpoint, DTO schema) cho nguoi khong dang nhap (phat hien khi rieng soat).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# (Prompt #8, P2 quan sat) show-details: always cua application.yml GIU NGUYEN o prod - ranh gioi
# bao mat cho /actuator/** la MANG (khong nginx proxy ra Internet, port khong publish ra host, xem
# docker/nginx.conf + docker-compose.yml), khong phai an chi tiet health o tang ung dung.

logging:
  level:
    root: WARN
    com.quanlycuahang.erp: INFO
