spring:
  application:
    name: erp-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  timezone: Asia/Ho_Chi_Minh
  jwt:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  auth:
    refresh-cookie-secure: true
  email:
    enabled: ${INVOICE_EMAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@quanlycuahang.local}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  vietqr:
    bank-bin: ${VIETQR_BANK_BIN:970436}
    account-number: ${VIETQR_ACCOUNT_NUMBER:0000000000}
    merchant-name: ${VIETQR_MERCHANT_NAME:CUA HANG}
    merchant-city: ${VIETQR_MERCHANT_CITY:HA NOI}
